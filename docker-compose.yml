# Generic self-hosting compose. Copy `.env.example` to `.env`, fill it in, and
# `docker compose up -d`.
#
# The deployment on Mehdi's NAS uses a variant of this with absolute paths, so
# it can be pasted straight into the UGOS Docker UI — see
# `X:\Homelab\docs\tether_setup.md`. Keep the two in sync when this one changes.
services:
  tether:
    # Build from source by default. Once the image is published, self-hosters
    # can drop the `build:` block and use the registry copy instead:
    #   image: ghcr.io/mehdiacho/tether:latest
    image: tether:latest
    build:
      context: .
    container_name: tether
    restart: unless-stopped

    # Everything secret lives in .env, so this file stays safe to publish.
    env_file:
      - .env

    environment:
      TZ: "${TZ:-UTC}"
      PORT: "8790"
      DB_PATH: "/data/tether.db"

    volumes:
      # SQLite plus kept call recordings.
      - ./data:/data
      # The Firebase service-account key, read-only, if you use the Android app.
      # Comment this out (and FCM_CREDENTIALS in .env) if you don't.
      - ./secrets/tether-fcm.json:/run/secrets/tether-fcm.json:ro

    ports:
      - "8790:8790"

    # The image carries its own HEALTHCHECK against /health.

    networks:
      - tether

networks:
  tether:
    driver: bridge
