name: Publish image

# Publishes a multi-arch image to GHCR so Tether can be self-hosted by anyone.
#
# Tag-driven rather than push-driven: `:latest` moving on every commit to main
# is how self-hosters end up running a half-finished refactor. Cut a tag when a
# version is meant to be run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The workflow's own GITHUB_TOKEN carries this. That matters: the `gh` CLI
      # on the dev machine is not authorised for `write:packages`, so publishing
      # from CI avoids widening a personal token's scope.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 matters here — plenty of self-hosters run this on a Pi or an ARM
      # NAS, and an amd64-only image simply refuses to start there.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
